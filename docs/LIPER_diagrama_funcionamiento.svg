<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1470" role="img" aria-label="Flujo de la aplicación LIPER"><title>Flujo de la aplicación LIPER</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526781"/></marker></defs><rect width="1120" height="1470" fill="#f6f8fc"/><text x="350" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152d47">LECTOR DE MATRÍCULAS</text><text x="885" y="41" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#152d47">HEARTBEAT INDEPENDIENTE</text><rect x="70" y="75" width="560" height="65" rx="14" fill="#e3f4ef" stroke="#81bbac" stroke-width="2"/><text x="350.0" y="113.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Iniciar lector, cámara y modelo</text><rect x="70" y="175" width="560" height="65" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="350.0" y="213.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Capturar fotograma</text><rect x="70" y="275" width="560" height="65" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="350.0" y="313.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Ejecutar detector TensorFlow</text><polygon points="350.0,375 630,430.0 350.0,485 70,430.0" fill="#fff1ce" stroke="#d8ac40" stroke-width="2"/><text x="350.0" y="436.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">¿Hay detecciones ≥ 0.45?</text><rect x="70" y="525" width="560" height="80" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="350.0" y="558.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Elegir última detección</text><text x="350.0" y="584.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">y preparar recorte con CLAHE</text><polygon points="350.0,650 630,700.0 350.0,750 70,700.0" fill="#fff1ce" stroke="#d8ac40" stroke-width="2"/><text x="350.0" y="693.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">¿Control de repetición permite</text><text x="350.0" y="719.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">y trabajador OCR libre?</text><rect x="70" y="790" width="560" height="80" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="350.0" y="823.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Preservar foto completa</text><text x="350.0" y="849.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">y bytes exactos del recorte</text><rect x="70" y="915" width="560" height="65" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="350.0" y="953.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Azure OCR lee el recorte</text><rect x="70" y="1020" width="560" height="80" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="350.0" y="1053.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Normalizar y filtrar líneas;</text><text x="350.0" y="1079.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">finalizar JSON de evidencia</text><rect x="70" y="1145" width="560" height="80" rx="14" fill="#e3f4ef" stroke="#81bbac" stroke-width="2"/><text x="350.0" y="1178.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Genyus: texto + serie + lado</text><text x="350.0" y="1204.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Solo candidatos elegibles</text><rect x="70" y="1270" width="560" height="65" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="350.0" y="1308.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Continuar captura</text><polyline points="350,140 350,175" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,240 350,275" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,340 350,375" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,485 350,525" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,605 350,650" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,750 350,790" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,870 350,915" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,980 350,1020" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,1100 350,1145" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="350,1225 350,1270" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390" y="509" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#152d47">Sí</text><text x="390" y="774" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#152d47">Sí</text><polyline points="630,430 680,430 680,207 630,207" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><text x="655" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#405a75">No</text><polyline points="630,700 680,700 680,430" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><text x="670" y="636" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#405a75">No / ocupado</text><polyline points="70,1302 25,1302 25,207 70,207" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="735" y="80" width="325" height="95" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="897.5" y="120.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Recoger métricas</text><text x="897.5" y="146.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Ciclo de unos 30 segundos</text><rect x="735" y="240" width="325" height="70" rx="14" fill="#e3f4ef" stroke="#81bbac" stroke-width="2"/><text x="897.5" y="281.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Heartbeat a Genyus</text><rect x="735" y="365" width="325" height="95" rx="14" fill="#e3f4ef" stroke="#81bbac" stroke-width="2"/><text x="897.5" y="405.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Monitor HTTPS opcional</text><text x="897.5" y="431.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Token de escritura requerido</text><polyline points="897,175 897,240" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="735,127 705,127 705,412 735,412" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="735" y="505" width="325" height="100" rx="14" fill="#edf1f7" stroke="#b8c9de" stroke-width="2"/><text x="897.5" y="535.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Destinos independientes</text><text x="897.5" y="561.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">No contiene fotografías</text><text x="897.5" y="587.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">ni texto de matrículas</text><rect x="735" y="690" width="325" height="120" rx="14" fill="#edf1f7" stroke="#b8c9de" stroke-width="2"/><text x="897.5" y="730.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">OCR en segundo plano:</text><text x="897.5" y="756.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">la captura y detección continúan.</text><text x="897.5" y="782.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Máximo un trabajo OCR activo.</text><rect x="735" y="1020" width="325" height="100" rx="14" fill="#fce8e5" stroke="#d5948c" stroke-width="2"/><text x="897.5" y="1050.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Error OCR o sin texto aceptado:</text><text x="897.5" y="1076.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">log y copia completa</text><text x="897.5" y="1102.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">adicional en ErrorOCR</text><polyline points="630,947 680,947 680,1055 735,1055" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><text x="680" y="1001" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#405a75">Error</text><polyline points="630,1060 735,1060" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1060,1070 1090,1070 1090,1302 630,1302" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="735" y="1170" width="325" height="85" rx="14" fill="#edf1f7" stroke="#b8c9de" stroke-width="2"/><text x="897.5" y="1205.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Si falla Genyus: registrar error.</text><text x="897.5" y="1231.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">No hay cola de reenvío.</text><rect x="70" y="1380" width="990" height="65" rx="14" fill="#edf1f7" stroke="#b8c9de" stroke-width="2"/><text x="565.0" y="1418.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Fotos archivadas conservadas · Limpieza automática desactivada</text></svg>