<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1580" role="img" aria-label="Flujo de instalación LIPER"><title>Flujo de instalación LIPER</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526781"/></marker></defs><rect width="1120" height="1580" fill="#f6f8fc"/><text x="370" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#152d47">INSTALACIÓN Y PUESTA EN MARCHA</text><rect x="70" y="75" width="600" height="75" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="370.0" y="118.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Ejecutar instalador</text><rect x="70" y="180" width="600" height="75" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="370.0" y="210.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Validar plataforma, paquete,</text><text x="370.0" y="236.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">modelo, espacio y destino nuevo</text><rect x="70" y="290" width="600" height="75" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="370.0" y="333.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Buscar entornos existentes</text><polyline points="370,150 370,180" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="370,255 370,290" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="370,365 370,405" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polygon points="370.0,405 670,455.0 370.0,505 70,455.0" fill="#fff1ce" stroke="#d8ac40" stroke-width="2"/><text x="370.0" y="448.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">¿Importaciones y versiones</text><text x="370.0" y="474.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">compatibles para el usuario?</text><rect x="70" y="555" width="280" height="100" rx="14" fill="#e3f4ef" stroke="#81bbac" stroke-width="2"/><text x="210.0" y="598.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Reutilizar entorno</text><text x="210.0" y="624.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Sin apt ni pip</text><rect x="390" y="555" width="280" height="100" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="530.0" y="598.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Crear entorno nuevo</text><text x="530.0" y="624.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Instalar dependencias</text><polyline points="370,505 210,530 210,555" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><text x="210" y="521" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#405a75">Sí</text><polyline points="370,505 530,530 530,555" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><text x="530" y="521" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#405a75">No</text><polyline points="210,655 210,690 370,690 370,720" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="530,655 530,690 370,690" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="720" width="600" height="80" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="370.0" y="753.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Copiar código y modelo;</text><text x="370.0" y="779.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">preparar carpetas y servicios</text><rect x="70" y="845" width="600" height="80" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="370.0" y="878.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Pedir credenciales y guardar configuración</text><text x="370.0" y="904.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Ventana o terminal interactiva</text><rect x="70" y="970" width="600" height="85" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="370.0" y="1005.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Comprobar configuración, DNS/TLS,</text><text x="370.0" y="1031.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">imports, modelo y cámara libre</text><rect x="70" y="1100" width="600" height="80" rx="14" fill="#ffffff" stroke="#b8c9de" stroke-width="2"/><text x="370.0" y="1146.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Arrancar lector y heartbeat</text><polygon points="370.0,1225 670,1275.0 370.0,1325 70,1275.0" fill="#fff1ce" stroke="#d8ac40" stroke-width="2"/><text x="370.0" y="1268.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">¿Llega un fotograma reciente</text><text x="370.0" y="1294.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">del PID actual del lector?</text><rect x="70" y="1390" width="600" height="85" rx="14" fill="#e3f4ef" stroke="#81bbac" stroke-width="2"/><text x="370.0" y="1425.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Habilitar arranque automático;</text><text x="370.0" y="1451.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">verificar operación real</text><polyline points="370,800 370,845" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="370,925 370,970" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="370,1055 370,1100" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="370,1180 370,1225" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="370,1325 370,1390" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><text x="410" y="1361" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#152d47">Sí</text><rect x="770" y="180" width="280" height="110" rx="14" fill="#fce8e5" stroke="#d5948c" stroke-width="2"/><text x="910.0" y="215.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Si falla una validación:</text><text x="910.0" y="241.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">detener el proceso</text><text x="910.0" y="267.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">y guardar reporte</text><rect x="770" y="405" width="280" height="130" rx="14" fill="#edf1f7" stroke="#b8c9de" stroke-width="2"/><text x="910.0" y="437.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Un sistema limpio aún</text><text x="910.0" y="463.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">requiere validación completa.</text><text x="910.0" y="489.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Instalar librerías grandes</text><text x="910.0" y="515.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">puede tardar.</text><rect x="770" y="845" width="280" height="80" rx="14" fill="#edf1f7" stroke="#b8c9de" stroke-width="2"/><text x="910.0" y="878.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Claves ocultas</text><text x="910.0" y="904.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">No incluirlas en GitHub</text><rect x="770" y="970" width="280" height="110" rx="14" fill="#fce8e5" stroke="#d5948c" stroke-width="2"/><text x="910.0" y="1005.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Si falla, revisar reporte.</text><text x="910.0" y="1031.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">No arrancar hasta</text><text x="910.0" y="1057.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">resolver la causa.</text><polyline points="670,1012 770,1012" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="770" y="1215" width="280" height="130" rx="14" fill="#fce8e5" stroke="#d5948c" stroke-width="2"/><text x="910.0" y="1260.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Si falla el arranque:</text><text x="910.0" y="1286.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">detener ambos servicios</text><text x="910.0" y="1312.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">y revisar diagnóstico.</text><polyline points="670,1275 770,1275" fill="none" stroke="#526781" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="1256" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#405a75">No</text><rect x="70" y="1510" width="980" height="50" rx="14" fill="#edf1f7" stroke="#b8c9de" stroke-width="2"/><text x="560.0" y="1541.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#152d47">Equipo en producción: usar promoción controlada y respaldo, no reinstalar encima.</text></svg>